[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "acme-analytics-api"
version = "1.4.0"
description = "Offline sample pyproject.toml with dependency and tool findings"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "requests*",
  "internal-sdk @ git+https://github.com/acme/internal-sdk.git@main"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.7.0",
  "mypy>=1.12.0"
]

[project.scripts]
acme-api = "acme_analytics.cli:main"

[tool.poetry.group.docs.dependencies]
mkdocs = "*"

[[tool.uv.index]]
name = "private"
url = "https://ci-bot:s3cr3tPass@pypi.internal.example/simple"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["S101", "E501"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
